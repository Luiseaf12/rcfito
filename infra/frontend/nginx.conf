server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  resolver 127.0.0.11 valid=30s;
  location = /rcfito-config.json {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  location = /api/application-draft {
    client_max_body_size 128k;
    limit_except POST { deny all; }
    proxy_pass https://rcfito.paxxa.chatgpt.site/api/application-draft;
    proxy_ssl_server_name on;
    proxy_ssl_name rcfito.paxxa.chatgpt.site;
    proxy_set_header Host rcfito.paxxa.chatgpt.site;
    proxy_set_header Origin https://rcfito.paxxa.chatgpt.site;
    proxy_set_header Cookie "";
    proxy_read_timeout 55s;
  }
  location /supabase/ {
    if ($uri !~ ^/supabase/(auth/v1|rest/v1|functions/v1)(/|$)) { return 404; }
    set $backend http://api-gw:8000;
    rewrite ^/supabase/(.*)$ /$1 break;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location = /api/ai-settings {
    client_max_body_size 16k;
    limit_except GET PUT { deny all; }
    proxy_pass https://rcfito.paxxa.chatgpt.site/api/ai-settings;
    proxy_ssl_server_name on;
    proxy_ssl_name rcfito.paxxa.chatgpt.site;
    proxy_set_header Host rcfito.paxxa.chatgpt.site;
    proxy_set_header Origin https://rcfito.paxxa.chatgpt.site;
    proxy_set_header Cookie "";
    proxy_read_timeout 55s;
  }
  location = /api/ai-settings/test {
    client_max_body_size 16k;
    limit_except POST { deny all; }
    proxy_pass https://rcfito.paxxa.chatgpt.site/api/ai-settings/test;
    proxy_ssl_server_name on;
    proxy_ssl_name rcfito.paxxa.chatgpt.site;
    proxy_set_header Host rcfito.paxxa.chatgpt.site;
    proxy_set_header Origin https://rcfito.paxxa.chatgpt.site;
    proxy_set_header Cookie "";
    proxy_read_timeout 55s;
  }
}
