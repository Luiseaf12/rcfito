# Entrada exclusiva de la API para el Quick Tunnel; no sirve el frontend ni Studio.
map $http_origin $rcfito_origin {
  default "";
  "https://rcfito.paxxa.chatgpt.site" "https://rcfito.paxxa.chatgpt.site";
}

map $http_origin $rcfito_origin_denied {
  default 1;
  "" 0;
  "https://rcfito.paxxa.chatgpt.site" 0;
}

server {
  listen 8080;
  server_name _;
  access_log off;
  resolver 127.0.0.11 valid=30s;
  client_max_body_size 1m;

  add_header X-Content-Type-Options nosniff always;
  add_header Cache-Control "no-store" always;

  # Nombres de rutas de esta API: ASCII. Evitar que una segunda decodificación
  # en el gateway convierta escapes residuales o barras invertidas en otra ruta.
  # Los filtros y nombres con acentos en la consulta no se limitan por esta regla.
  if ($uri !~ "^/[a-zA-Z0-9_./-]*$") { return 404; }

  location = /healthz {
    if ($remote_addr != 127.0.0.1) { return 404; }
    return 200;
  }

  # Las cuentas se administran por la función privada de RCFito.
  location ~ ^/auth/v1/(admin|invite|generate_link|signup)(/|$) {
    return 404;
  }

  location ~ ^/(auth/v1|rest/v1|functions/v1)(/|$) {
    if ($rcfito_origin_denied) { return 403; }
    if ($request_method = OPTIONS) { return 204; }

    # Un único juego de cabeceras CORS, incluso si el gateway añade las suyas.
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Expose-Headers;
    add_header Access-Control-Allow-Origin $rcfito_origin always;
    add_header Access-Control-Allow-Methods "GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "authorization, apikey, content-type, x-client-info, x-supabase-api-version, prefer, range, range-unit, accept-profile, content-profile" always;
    add_header Access-Control-Expose-Headers "Content-Range, Range, Preference-Applied" always;
    add_header Vary Origin always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;

    set $backend http://rcfito-gateway:8000;
    proxy_pass $backend$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / { return 404; }
}
