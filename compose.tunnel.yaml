name: rcfito-tunnel

services:
  api-proxy:
    container_name: rcfito-api-proxy
    image: nginx:stable-alpine@sha256:0e52bd054126cdc040b1276c0af347aeb02a41b9cfe305d6094767ac30e97949
    restart: unless-stopped
    volumes:
      - ./infra/tunnel/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - backend
    healthcheck:
      test: [CMD, wget, --spider, -q, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 5s
      retries: 6

  cloudflared:
    container_name: rcfito-quick-tunnel
    image: cloudflare/cloudflared@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    restart: unless-stopped
    command: [tunnel, --no-autoupdate, --protocol, http2, --url, 'http://api-proxy:8080']
    depends_on:
      api-proxy:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:
    external: true
    name: rcfito-backend
